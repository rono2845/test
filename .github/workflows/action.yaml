name: Workflow 1
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: |
          npm run lint
          echo "Linting Done"
      
      - name: Test
        run: |
          npm run test
          echo "Testing Done"

      - name: Deploying
        run: |
          echo "Deploy Done"
